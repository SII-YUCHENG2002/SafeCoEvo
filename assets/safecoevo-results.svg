<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc">
  <title id="title">SafeCoEvo: Generalization on the Test Set</title>
  <desc id="desc">Comparison of SHE, static SafeCoEvo, SafeCoEvo without GuardVPO, and full SafeCoEvo on unsafe outcome rate, task success rate, and safe and useful completion rate.</desc>
  <rect width="1000" height="585" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="78" rx="12" fill="#e9f4f1"/>
