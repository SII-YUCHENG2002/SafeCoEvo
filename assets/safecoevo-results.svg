  <text x="748" y="134" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#173e46">SUCR ↑</text>
  <text x="748" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#587179">Higher is better</text>
